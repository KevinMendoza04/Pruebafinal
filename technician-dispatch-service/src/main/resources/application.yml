server:
  port: 8081

spring:
  application:
    name: technician-dispatch-service
  # Structured ECS-format logging (Spring Boot native)
  logging:
    structured:
      format:
        console: ecs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    diskspace:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
