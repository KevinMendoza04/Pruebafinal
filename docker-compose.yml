version: "3.8"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: helpflow
      POSTGRES_USER: helpflow
      POSTGRES_PASSWORD: helpflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  dispatch-service:
    build: ./technician-dispatch-service
    ports:
      - "8081:8081"
    depends_on: []
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  ticket-service:
    build: ./support-ticket-service
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      dispatch-service:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/helpflow
      DB_USERNAME: helpflow
      DB_PASSWORD: helpflow
      JWT_SECRET: helpflow-production-secret-key-32-bytes-min!!
      JWT_EXPIRATION_MINUTES: "60"
      DISPATCH_BASE_URL: http://dispatch-service:8081
      ADMIN_DOCUMENT: ADMIN-000
      ADMIN_EMAIL: admin@helpflow.com
      ADMIN_PASSWORD: Admin123!
      CORPORATE_EMAIL_DOMAIN: helpflow.com
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
