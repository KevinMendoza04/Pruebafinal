server:
  port: 8080

spring:
  application:
    name: support-ticket-service

  # Structured ECS-format logging
  logging:
    structured:
      format:
        console: ecs

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/helpflow}
    username: ${DB_USERNAME:helpflow}
    password: ${DB_PASSWORD:helpflow}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # Generate statistics to prove N+1 is avoided (test verifies this)
        generate_statistics: true

  flyway:
    enabled: true
    locations: classpath:db/migration

# HelpFlow custom properties
helpflow:
  jwt:
    secret: ${JWT_SECRET:dummy-secret-change-me-at-least-32-bytes-long!!}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  dispatch:
    base-url: ${DISPATCH_BASE_URL:http://localhost:8081}
  corporate-email-domain: ${CORPORATE_EMAIL_DOMAIN:helpflow.com}
  escalation:
    scan-interval: ${ESCALATION_SCAN_INTERVAL:60}s
    threshold-percent: ${ESCALATION_THRESHOLD_PERCENT:80}

# Actuator: health and info public; metrics and prometheus secured in PROMPT 4
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    diskspace:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.riwi.helpflow: INFO
